[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os"
version = "0.1.0"
description = "Local-first control plane for safe autonomous execution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-os = "ai_os.cli:main"

[tool.setuptools.packages.find]
include = ["ai_os*"]
