name: Robbinhoods Agent tests

on:
  push:
    branches:
      - "robinhood/**"
  pull_request:
    paths:
      - "ai_os/**"
      - "tests/**"
      - "ROBINHOOD_OPTIONS_PAPER_POLICY.md"
      - "pyproject.toml"
      - ".github/workflows/robinhood-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
