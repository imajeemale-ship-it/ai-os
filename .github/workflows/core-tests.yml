name: AI-OS core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library core test suite
        run: python -m unittest discover -s tests -v
      - name: Check package installation
        run: python -m pip install --no-deps .
      - name: CLI smoke test
        run: |
          export AI_OS_DB="$RUNNER_TEMP/ai_os_ci.db"
          python -m ai_os init
          python -m ai_os plan
